<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>MsgMe</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PIN gate -->
<section id="pin-screen" class="screen">
  <div class="card">
    <h1>MsgMe</h1>
    <p class="sub">Enter the shared PIN to continue</p>
    <input id="pin-input" type="tel" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="12">
    <button id="pin-submit" class="btn primary">Unlock</button>
    <p id="pin-error" class="error"></p>
  </div>
</section>

<!-- Identity pick (first run only) -->
<section id="identity-screen" class="screen hidden">
  <div class="card">
    <h1>Who are you?</h1>
    <p class="sub">This is remembered on this phone only</p>
    <button class="btn identity-btn" data-id="A">Person A</button>
    <button class="btn identity-btn" data-id="B">Person B</button>
  </div>
</section>

<!-- Main app -->
<section id="main-screen" class="screen hidden">
  <header class="topbar">
    <button id="logout-btn" class="icon-btn logout" aria-label="Log out" title="Log out">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </header>

  <div class="content">

    <div class="panel compact-panel">
      <h2 class="panel-title">Your status <span id="me-tag" class="me-tag"></span></h2>
      <div id="status-options" class="status-grid"></div>
    </div>

    <div class="panel compact-panel partner-panel">
      <h2 id="partner-title">Partner's status</h2>
      <div id="partner-status" class="partner-status">
        <span id="partner-badge" class="badge">—</span>
        <span id="partner-updated" class="updated">not connected yet</span>
      </div>
    </div>

    <div class="panel chat-panel">
      <h2 class="panel-title">Messages <button id="clear-chat" class="text-btn">Clear</button></h2>
      <div id="chat-thread" class="chat-thread">
        <p class="chat-empty" id="chat-empty">No messages yet this session.</p>
      </div>
      <div class="chat-input-row">
        <textarea id="msg-input" placeholder="Type a short message..." maxlength="300"></textarea>
        <button id="msg-send" class="btn primary">Send</button>
      </div>
    </div>

  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
