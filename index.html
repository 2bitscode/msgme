<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>U2U</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PIN gate -->
<section id="pin-screen" class="screen">
  <div class="card">
    <h1>U2U</h1>
    <p class="sub">Enter the shared PIN to continue</p>
    <input id="pin-input" type="tel" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="12">
    <button id="pin-submit" class="btn primary">Unlock</button>
    <p id="pin-error" class="error"></p>
  </div>
</section>

<!-- Identity pick (first run only) -->
<section id="identity-screen" class="screen hidden">
  <div class="card">
    <h1>Who are you?</h1>
    <p class="sub">This is remembered on this phone only</p>
    <button class="btn identity-btn" data-id="A">U1</button>
    <button class="btn identity-btn" data-id="B">U2</button>
  </div>
</section>

<!-- Main app -->
<section id="main-screen" class="screen hidden">
  <header class="topbar">
    <span class="app-id">
      <span id="app-label" class="app-label"></span>
      <span id="conn-dot" class="conn-dot" title="Connecting…"></span>
    </span>
    <span class="topbar-actions">
      <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound" title="Sound off">
        <svg id="sound-icon-on" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 9 3 15 8 15 13 20 13 4 8 9 3 9"></polygon>
          <path d="M17 9a4 4 0 0 1 0 6"></path>
          <path d="M19.5 6.5a8 8 0 0 1 0 11"></path>
        </svg>
        <svg id="sound-icon-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 9 3 15 8 15 13 20 13 4 8 9 3 9"></polygon>
          <line x1="17" y1="9" x2="23" y2="15"></line>
          <line x1="23" y1="9" x2="17" y2="15"></line>
        </svg>
      </button>
      <button id="logout-btn" class="icon-btn logout" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </span>
  </header>

  <div class="content">

    <div class="panel compact-panel status-row">
      <div class="status-col">
        <h2 class="panel-title">You <span id="me-tag" class="me-tag"></span></h2>
        <div id="status-options" class="status-grid"></div>
      </div>
      <div class="status-col partner-col">
        <h2 id="partner-title">Partner</h2>
        <div id="partner-status" class="partner-status">
          <span id="partner-badge" class="badge">—</span>
          <span id="partner-updated" class="updated">not connected yet</span>
          <span id="partner-last-login" class="updated">last login: never</span>
          <span id="partner-last-read" class="updated">last read: never</span>
          <span id="partner-unread" class="updated">unread: 0</span>
        </div>
      </div>
    </div>

    <div class="panel chat-panel">
      <h2 class="panel-title">Messages <button id="clear-chat" class="text-btn">Clear</button></h2>
      <div id="chat-thread" class="chat-thread">
        <p class="chat-empty" id="chat-empty">No messages yet this session.</p>
      </div>
      <p id="typing-indicator" class="typing-indicator hidden">typing…</p>
      <div id="reply-preview" class="reply-preview hidden">
        <span id="reply-preview-text" class="reply-preview-text"></span>
        <button id="reply-cancel" class="text-btn" aria-label="Cancel reply">✕</button>
      </div>
      <div class="chat-input-row">
        <textarea id="msg-input" placeholder="Type a short message..." maxlength="300"></textarea>
        <div class="chat-input-actions">
          <button id="image-pick-btn" class="btn icon-only" type="button" aria-label="Send a photo" title="Send a photo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>
          <input id="image-input" type="file" accept="image/*" capture="environment" class="hidden">
          <button id="msg-send" class="btn primary">Send</button>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
